name: ci

# Required status check name: gates
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      PCM_PIN: 412d190e6244ef59279ad5d60f4c7622bfb43e5f
      CGM_PIN: c069613ca8b3e02bcf5aba1960160583537f8a3a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned continuity CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Pukujan/project-continuity-modules.git@${PCM_PIN}"
          continuity --version

      - name: Continuity validate
        run: continuity validate --root .

      - name: Continuity preflight (TARGET_VALID)
        run: continuity preflight --root .

      - name: Checkout pinned content helper
        uses: actions/checkout@v4
        with:
          repository: Pukujan/content-generation-modules
          ref: ${{ env.CGM_PIN }}
          path: .ci-cgm

      - name: Content helper adapter validate
        run: |
          python .ci-cgm/scripts/validate_content_system.py \
            --root .ci-cgm \
            --adapter .content-system \
            --project-root .

      - name: Confirm HSW always-on contract
        run: python .ci-cgm/scripts/verify_hsw_applied.py --root .ci-cgm

      - name: Explore JS syntax
        run: |
          node --check explore/app.js
          node --check explore/feature.js

      - name: Explore click-gate plan present
        run: |
          test -f tests/explore_click_gate.md
          test -f scripts/run_explore_click_gate.py
          python scripts/run_explore_click_gate.py --dry-print || test $? -eq 2

      - name: No committed secrets (tracked tree)
        run: |
          if git grep -nIE 'sk-or-[A-Za-z0-9]|yolo_[A-Za-z0-9]{4,}|api[_-]?key["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{20}'; then
            echo "FAIL: tracked secret-like string found"
            exit 1
          fi
          echo "OK: no committed secrets"
